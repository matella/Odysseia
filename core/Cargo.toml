[package]
name = "timeline_core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Moteur de calcul Odysseia : parsing, pipeline, stats et rendu vidéo. Zéro réseau."
repository = "https://github.com/matella/Odysseia"
publish = false

# Contrainte (§6.1) : aucune dépendance Flutter/Dart ici. Le crate doit
# compiler et se tester seul (`cargo test`), et cibler aussi
# wasm32-unknown-unknown (§6.2) — d'où l'absence de `clock` sur chrono, qui
# tirerait une dépendance plateforme inutile ici.
[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = "1"
serde_json = "1"
thiserror = "2"

[dev-dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }

[lints.rust]
missing_docs = "warn"

[lints.clippy]
todo = "allow"
