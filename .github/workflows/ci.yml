# CI légère (§3.9) : vérifier que ça compile et que les tests passent.
#
# Pas de pipeline de release, pas de signature, pas de publication — les
# binaires desktop/iOS sont compilés localement à la demande (§4).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_goldens:
        description: >-
          Régénérer les images de référence des golden tests et les publier en
          artefact. Linux est la plateforme de référence (§3.10) : les images
          se régénèrent ici, pas sur la machine du développeur.
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Épinglé : les golden tests (§3.10) sont sensibles à la version de Flutter.
  FLUTTER_VERSION: 3.41.3

jobs:
  core:
    name: core — cargo test + clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          # Le web passe par un build WASM distinct du natif (§6.2) :
          # on vérifie la cible dès maintenant plutôt que trop tard.
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - run: cargo test --all-features

      - run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Vérification cible WASM (§6.2)
        run: cargo check --target wasm32-unknown-unknown

  bridge:
    name: bridge — build + clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bridge

      - run: cargo build

      - run: cargo clippy --all-targets -- -D warnings

      # Le pont doit tenir sur WASM aussi, sinon la cible web est morte (§6.2).
      - name: Vérification cible WASM (§6.2)
        run: cargo check --target wasm32-unknown-unknown

  app:
    name: app — flutter analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bridge

      # Les tests du pont chargent la bibliothèque native depuis
      # `bridge/target/debug` — sans elle, ils échouent au lieu d'être
      # silencieusement sautés (voir `test/bridge/rust_lib.dart`).
      - name: Construire la bibliothèque native
        working-directory: bridge
        run: cargo build

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: flutter pub get
        working-directory: app
        run: flutter pub get

      - name: flutter analyze
        working-directory: app
        run: flutter analyze

      # Unitaires + golden (§3.10). Les images de référence sont produites
      # sous Linux : c'est la plateforme de référence, seule à les comparer.
      - name: flutter test
        if: ${{ !inputs.update_goldens }}
        working-directory: app
        run: flutter test

      - name: Régénérer les images de référence
        if: ${{ inputs.update_goldens }}
        working-directory: app
        run: flutter test test/golden --update-goldens

      - name: Publier les images régénérées
        if: ${{ inputs.update_goldens }}
        uses: actions/upload-artifact@v4
        with:
          name: goldens
          path: app/test/golden/images/

      # En cas d'échec, les images attendue/obtenue/diff valent mille mots.
      - name: Publier les écarts de golden
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: app/test/golden/failures/
          if-no-files-found: ignore

  build:
    name: build de vérification — Android + web
    runs-on: ubuntu-latest
    needs: [app, bridge]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # cargokit compile `bridge/` pour chaque architecture Android : la
      # toolchain Rust et les cibles sont donc nécessaires ici aussi.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            aarch64-linux-android,
            armv7-linux-androideabi,
            x86_64-linux-android,
            i686-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bridge

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: flutter pub get
        working-directory: app
        run: flutter pub get

      # APK de debug : signé avec la clé de debug locale, jamais publié (§4).
      - name: Build Android (debug)
        working-directory: app
        run: flutter build apk --debug

      - name: Build web
        working-directory: app
        run: flutter build web
